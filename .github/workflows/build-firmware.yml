# GitHub Actions Workflow for Building OpenWRT Firmware

name: Build OpenWRT Firmware

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device (e.g., s905x2, rk3328)'
        required: true
        default: 's905x2'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1.66-DBAI)'
        required: true
        default: '6.1.66-DBAI'
      rootfs_url:
        description: 'URL to the rootfs file'
        required: true
        default: 'https://github.com/armarchindo/ULO-repository/raw/main/rootfs/openwrt-23.05.5-vanila-armsr-armv8-generic-ext4-rootfs.img.gz'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Install Dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends lolcat pigz aria2 wget jq unrar p7zip-full

      - name: 2. Run ULO Builder
        run: |
          echo "Cloning ULO-Builder repository..."
          git clone https://github.com/armarchindo/ULO-Builder.git

          echo "Downloading rootfs from ${{ github.event.inputs.rootfs_url }}"
          wget -O rootfs.img.gz "${{ github.event.inputs.rootfs_url }}"
          ROOTFS_FILENAME="rootfs.img.gz"
          
          echo "Setting up ULO-Builder environment..."
          cd ULO-Builder
          mkdir -p rootfs
          mv ../"$ROOTFS_FILENAME" ./rootfs/
          chmod +x ./ulo

          echo "Starting build process..."
          # Menjalankan skrip ULO secara non-interaktif dengan sudo
          sudo ./ulo \
            -m "${{ github.event.inputs.target_device }}" \
            -r "$ROOTFS_FILENAME" \
            -k "${{ github.event.inputs.kernel_version }}" \
            -s 1024 # Menggunakan ukuran default 1024

      - name: 3. Upload Artifact to Release
        run: |
          echo "Build finished. Firmware is located in ULO-Builder/out/"
          ls -R ULO-Builder/out/
          # Langkah selanjutnya adalah mengunggah hasil build ke GitHub Releases
