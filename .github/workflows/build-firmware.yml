# GitHub Actions Workflow for Building OpenWRT Firmware

name: Build OpenWRT Firmware

on:
  workflow_dispatch:
    inputs:
      builder_type:
        description: 'Builder Type'
        required: true
        type: choice
        options:
          - ulo
          - ophub
        default: 'ulo'
      target_device:
        description: 'Target Device (e.g., s905x2, rk3328, h618-orangepi-zero3)'
        required: true
        default: 'h618-orangepi-zero3'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1.104-AW64-DBAI) - Required for ULO only'
        required: false
        default: '6.1.104-AW64-DBAI'
      rootfs_type:
        description: 'RootFS Type (ready or custom)'
        required: true
        default: 'ready'
        type: choice
        options:
          - ready
          - custom
      rootfs_filename:
        description: 'Pre-built Rootfs filename (for ready type)'
        required: false
        default: 'openwrt-23.05.5-vanila-armsr-armv8-generic-ext4-rootfs.img.gz'
      firmware_size:
        description: 'Firmware Size (MB)'
        required: false
        default: '1024'
      openwrt_version:
        description: 'OpenWrt Version (for custom rootfs)'
        required: false
        default: '24.10.2'
        type: choice
        options:
          - '24.10.2'
          - '24.10.1'
          - '24.10.0'
          - '23.05.6'
          - '23.05.5'
          - '23.05.4'
          - '23.05.3'
          - '23.05.2'
          - '23.05.1'
          - '23.05.0'
      firmware_base:
        description: 'Firmware Base (for custom rootfs)'
        required: false
        default: 'openwrt'
        type: choice
        options:
          - openwrt
          - immortalwrt
      custom_packages:
        description: 'Custom packages list (space separated)'
        required: false
        default: ''
      patch_filename:
        description: 'Patch filename (optional, ULO-Builder only)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Build Custom RootFS with ImageBuilder
        if: github.event.inputs.rootfs_type == 'custom'
        id: build_rootfs
        env:
          GITHUB_EVENT_INPUTS_BUILDER_TYPE: ${{ github.event.inputs.builder_type }}
        run: |
          echo "Building custom rootfs with ImageBuilder..."
          echo "Builder type: ${{ github.event.inputs.builder_type }}"
          
          # Set variables
          FIRMWARE_BASE="${{ github.event.inputs.firmware_base }}"
          VERSION="${{ github.event.inputs.openwrt_version }}"
          PACKAGES="${{ github.event.inputs.custom_packages }}"
          
          # Make scripts executable
          chmod +x scripts/openwrt-imagebuilder.sh
          chmod +x scripts/immortalwrt-imagebuilder.sh
          
          if [ "$FIRMWARE_BASE" = "openwrt" ]; then
            echo "Building OpenWrt custom rootfs..."
            ./scripts/openwrt-imagebuilder.sh "$VERSION" "$PACKAGES"
            
          elif [ "$FIRMWARE_BASE" = "immortalwrt" ]; then
            echo "Building ImmortalWrt custom rootfs..."
            ./scripts/immortalwrt-imagebuilder.sh "$VERSION" "$PACKAGES"
            
          else
            echo "Error: Unsupported firmware base: $FIRMWARE_BASE"
            exit 1
          fi
          
          echo "Custom rootfs build completed successfully!"

      - name: Setup Ready RootFS
        if: github.event.inputs.rootfs_type == 'ready'
        run: |
          echo "Using pre-built rootfs: ${{ github.event.inputs.rootfs_filename }}"
          echo "ROOTFS_FILENAME=${{ github.event.inputs.rootfs_filename }}" >> $GITHUB_ENV
          
          echo "RootFS configuration:"
          echo "- Type: Ready (pre-built)"
          echo "- Filename: ${{ github.event.inputs.rootfs_filename }}"
          echo "- Builder: ${{ github.event.inputs.builder_type }}"
          
          if [ "${{ github.event.inputs.builder_type }}" = "ulo" ]; then
            echo "- ULO-Builder will download the rootfs automatically during build"
          else
            echo "- Ophub Builder will download the rootfs from available sources"
          fi

      - name: Build with ULO-Builder
        if: github.event.inputs.builder_type == 'ulo'
        run: |
          echo "Building firmware with ULO-Builder..."
          
          # Make ULO script executable
          chmod +x scripts/ulo-builder.sh
          
          # Prepare patch file if specified
          PATCH_FILE="none"
          if [ -n "${{ github.event.inputs.patch_filename }}" ]; then
            echo "Downloading patch: ${{ github.event.inputs.patch_filename }}"
            wget -O patch.zip "https://raw.githubusercontent.com/armarchindo/ULO-Builder/main/patch/${{ github.event.inputs.patch_filename }}"
            PATCH_FILE="patch.zip"
          fi
          
          # Determine rootfs filename based on type
          if [ "${{ github.event.inputs.rootfs_type }}" = "ready" ]; then
            ROOTFS_FILE="${{ github.event.inputs.rootfs_filename }}"
          else
            # For custom rootfs, the filename will be set by the ImageBuilder step
            ROOTFS_FILE="${{ env.ROOTFS_FILENAME }}"
          fi
          
          echo "Using rootfs file: $ROOTFS_FILE"
          
          # Run ULO build
          ./scripts/ulo-builder.sh \
            "${{ github.event.inputs.target_device }}" \
            "${{ github.event.inputs.kernel_version }}" \
            "$ROOTFS_FILE" \
            "$PATCH_FILE" \
            "${{ github.event.inputs.firmware_size }}"
          
          echo "ULO-Builder completed successfully!"

      - name: Build with Ophub Builder
        if: github.event.inputs.builder_type == 'ophub'
        run: |
          echo "Building firmware with Ophub Builder..."
          
          # Make Ophub script executable
          chmod +x scripts/ophub-builder.sh
          
          # Determine rootfs filename based on type
          if [ "${{ github.event.inputs.rootfs_type }}" = "ready" ]; then
            ROOTFS_FILE="${{ github.event.inputs.rootfs_filename }}"
          else
            # For custom rootfs, the filename will be set by the ImageBuilder step
            ROOTFS_FILE="${{ env.ROOTFS_FILENAME }}"
          fi
          
          echo "Using rootfs file: $ROOTFS_FILE"
          
          # Run Ophub build
          ./scripts/ophub-builder.sh \
            "${{ github.event.inputs.target_device }}" \
            "$ROOTFS_FILE" \
            "${{ github.event.inputs.firmware_size }}"
          
          echo "Ophub Builder completed successfully!"


      - name: Create and Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.builder_type }}-${{ github.event.inputs.target_device }}-${{ github.run_number }}
          name: "[${{ github.event.inputs.builder_type }}] ${{ github.event.inputs.target_device }} | #${{ github.run_number }}"
          body: |
            🚀 **Firmware Build Otomatis**
            
            **Builder Information:**
            - **Builder Type**: ${{ github.event.inputs.builder_type == 'ulo' && 'ULO-Builder' || 'Ophub Builder' }}
            - **Target Device**: ${{ github.event.inputs.target_device }}
            ${{ github.event.inputs.builder_type == 'ulo' && format('- **Kernel Version**: {0}', github.event.inputs.kernel_version) || '' }}
            - **Firmware Size**: ${{ github.event.inputs.firmware_size }}MB
            
            **RootFS Configuration:**
            - **RootFS Type**: ${{ github.event.inputs.rootfs_type }}
            - **RootFS File**: ${{ env.ROOTFS_FILENAME }}
            ${{ github.event.inputs.rootfs_type == 'custom' && format('- **Firmware Base**: {0}', github.event.inputs.firmware_base) || '' }}
            ${{ github.event.inputs.rootfs_type == 'custom' && format('- **OpenWrt Version**: {0}', github.event.inputs.openwrt_version) || '' }}
            ${{ github.event.inputs.custom_packages != '' && format('- **Custom Packages**: {0}', github.event.inputs.custom_packages) || '- **Custom Packages**: None' }}
            ${{ github.event.inputs.builder_type == 'ulo' && github.event.inputs.patch_filename != '' && format('- **Patch**: {0}', github.event.inputs.patch_filename) || '' }}
            ${{ github.event.inputs.builder_type == 'ulo' && github.event.inputs.patch_filename == '' && '- **Patch**: None' || '' }}
            
            ---
            
            ${{ github.event.inputs.builder_type == 'ulo' && '📦 **ULO-Builder**: Universal firmware builder supporting all ARM devices' || '🔧 **Ophub Builder**: Specialized builder for Rockchip, Allwinner, and Amlogic devices' }}
          files: |
            ${{ github.event.inputs.builder_type == 'ulo' && './ulo-output/**/*.img.gz' || './ophub-output/**/*.img.gz' }}