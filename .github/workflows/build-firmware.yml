# GitHub Actions Workflow for Building OpenWRT Firmware

name: Build OpenWRT Firmware

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device (e.g., s905x2, rk3328)'
        required: true
        default: 'h618-orangepi-zero3'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1.104-AW64-DBAI)'
        required: true
        default: '6.1.104-AW64-DBAI'
      rootfs_filename:
        description: 'Rootfs filename (will be downloaded by ULO)'
        required: true
        default: 'openwrt-23.05.5-vanila-armsr-armv8-generic-ext4-rootfs.img.gz'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ULO-Builder
        run: |
          git clone https://github.com/bobbyunknown/ULO-Builder --branch dev --depth 1
          echo "ROOTFS_FILENAME=${{ github.event.inputs.rootfs_filename }}" >> $GITHUB_ENV

      - name: Run ULO-Builder
        run: |
          cd ULO-Builder
          
          echo "Mengaktifkan unduhan kustom..."
          sudo sed -i 's/DOWNLOAD_CUSTOM_KERNEL=false/DOWNLOAD_CUSTOM_KERNEL=true/' ulo
          sudo sed -i 's/DOWNLOAD_CUSTOM_ROOTFS=false/DOWNLOAD_CUSTOM_ROOTFS=true/' ulo

          echo "Verifikasi konfigurasi:"
          grep 'DOWNLOAD_CUSTOM' ulo

          echo "Menjalankan ULO Builder dan melewati pemilihan patch..."
          (echo "y"; echo "1") | sudo ./ulo -m "${{ github.event.inputs.target_device }}" -r "${{ env.ROOTFS_FILENAME }}" -k "${{ github.event.inputs.kernel_version }}" -s 1024

      - name: List Kernel DTBs
        run: |
          cd ULO-Builder
          echo "Mencari file .dtb di direktori ULO-Builder/core/kernel..."
          find ULO-Builder/core/kernel -type f -name "*.dtb" > kernels.txt
          echo "File .dtb yang ditemukan:"
          cat kernels.txt

      - name: Upload Kernel List Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-list
          path: kernels.txt