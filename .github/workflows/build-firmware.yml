# GitHub Actions Workflow for Building OpenWRT Firmware

name: Build OpenWRT Firmware

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device (e.g., s905x2, rk3328)'
        required: true
        default: 'h618-orangepi-zero3'
      kernel_version:
        description: 'Kernel Version (e.g., 6.1.104-AW64-DBAI)'
        required: true
        default: '6.1.104-AW64-DBAI'
      rootfs_filename:
        description: 'Rootfs filename (will be downloaded by ULO)'
        required: true
        default: 'openwrt-23.05.5-vanila-armsr-armv8-generic-ext4-rootfs.img.gz'
      jamu_number:
        description: 'Optional: Jamu patch number to apply'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ULO-Builder
        run: |
          git clone https://github.com/bobbyunknown/ULO-Builder --branch dev --depth 1
          echo "ROOTFS_FILENAME=${{ github.event.inputs.rootfs_filename }}" >> $GITHUB_ENV

      - name: Run ULO-Builder
        run: |
          cd ULO-Builder
          COMMAND="sudo ./ulo --custom-kernel --custom-rootfs"
          COMMAND+=" -m ${{ github.event.inputs.target_device }}"
          COMMAND+=" -r ${{ env.ROOTFS_FILENAME }}"
          COMMAND+=" -k ${{ github.event.inputs.kernel_version }}"
          COMMAND+=" -s 1024"

          if [[ -n "${{ github.event.inputs.jamu_number }}" ]]; then
            COMMAND+=" --jamu ${{ github.event.inputs.jamu_number }}"
          fi

          echo "Running command: $COMMAND"
          eval $COMMAND